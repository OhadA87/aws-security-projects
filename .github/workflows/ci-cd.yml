name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Lint and Test Phase
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [Domain4-Identity_and_Access_Management]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install CDK CLI
      run: npm install -g aws-cdk

    - name: Install dependencies
      run: |
        if [ -f "${{ matrix.domain }}/package.json" ]; then
          cd ${{ matrix.domain }}
          npm ci
        fi

    - name: Lint TypeScript
      run: |
        if [ -f "${{ matrix.domain }}/package.json" ]; then
          cd ${{ matrix.domain }}
          npm run lint
        fi

    - name: Run unit tests
      run: |
        if [ -f "${{ matrix.domain }}/package.json" ]; then
          cd ${{ matrix.domain }}
          npm test
        fi

    - name: CDK Synth
      run: |
        if [ -f "${{ matrix.domain }}/cdk.json" ]; then
          cd ${{ matrix.domain }}
          cdk synth
        fi

  # Development Environment Deployment
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://dev.aws-security-projects.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install CDK CLI
      run: npm install -g aws-cdk

    - name: Deploy to Dev
      run: |
        for domain in Domain4-Identity_and_Access_Management; do
          if [ -f "$domain/cdk.json" ]; then
            cd $domain
            npm ci
            cdk deploy --all --require-approval never --context environment=dev
            cd ..
          fi
        done

  # Staging Environment Deployment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint-and-test, deploy-dev]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.aws-security-projects.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install CDK CLI
      run: npm install -g aws-cdk

    - name: Deploy to Staging
      run: |
        for domain in Domain4-Identity_and_Access_Management; do
          if [ -f "$domain/cdk.json" ]; then
            cd $domain
            npm ci
            cdk deploy --all --require-approval never --context environment=staging
            cd ..
          fi
        done

    - name: Run integration tests
      run: |
        echo "Running integration tests on staging environment"
        # Add integration test commands here

  # Production Environment Deployment
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://aws-security-projects.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install CDK CLI
      run: npm install -g aws-cdk

    - name: Deploy to Production
      run: |
        for domain in Domain4-Identity_and_Access_Management; do
          if [ -f "$domain/cdk.json" ]; then
            cd $domain
            npm ci
            cdk deploy --all --require-approval never --context environment=prod
            cd ..
          fi
        done

    - name: Run smoke tests
      run: |
        echo "Running smoke tests on production environment"
        # Add smoke test commands here

    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      if: success()
      with:
        status: success
        text: 'AWS Security Projects deployed successfully to production'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}